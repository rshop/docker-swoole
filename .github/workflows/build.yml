name: Build image and push to Docker Hub

on:
  push:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build latest
        if: ${{ github.ref_name == '8.3' }}
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ secrets.DOCKER_PLATFORMS }}
          push: true
          tags: rshop/swoole:latest
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ secrets.DOCKER_PLATFORMS }}
          push: true
          tags: rshop/swoole:${{ github.ref_name }}
      -
        name: Create pipeline tag name
        id: pipeline-tag
        run: |
          tag="${{ github.ref_name }}"
          echo "::set-output name=tag::${tag/-mssql/}"
      -
        name: Trigger pipeline rebuild
        if: ${{ contains(github.ref_name, '-mssql') }}
        uses: rshop/trigger-workflow-action@v1
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          repository: 'rshop/docker-pipeline'
          branch: ${{ steps.pipeline-tag.outputs.tag }}
